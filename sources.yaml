  impeccable:
    # Direcao visual, critica e auditoria de interface; o bunshin usa quando esta instalado.
    # O launcher em scripts/ baixa o motor nativo (~22 MB) e confere com engine-checksums.txt.
    # Instalacao oficial: npx impeccable install --user --providers=claude --no-hooks -y
    repo: pbakaus/impeccable
    branch: main
    license: Apache-2.0
    mode: vendor
    watch: .claude
    paths:
      - LICENSE
      - NOTICE.md
      - README.md
      - .claude/skills/impeccable
      - .claude/agents

  reanimate:
